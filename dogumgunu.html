<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>🎉 Sürpriz Doğum Günü! 🎉</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ffb6c1, #ff69b4);
    font-family: "Poppins", sans-serif;
    text-align: center;
    overflow-x: hidden;
}
h1 {
    margin-top: 80px;
    color: white;
    font-size: 40px;
    text-shadow: 0 0 10px #ffdde6;
}
p {
    color: white;
    font-size: 20px;
}
button {
    margin-top: 40px;
    padding: 15px 30px;
    background: white;
    border: none;
    border-radius: 10px;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #ffe6f0;
    transform: scale(1.1);
}
#surprise {
    display: none;
    margin-top: 50px;
    font-size: 30px;
    color: #fff;
    animation: fadeIn 2s forwards;
}
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
.confetti {
    width: 10px;
    height: 10px;
    background-color: white;
    position: absolute;
    top: -10px;
    animation: fall 4s linear infinite;
}
@keyframes fall {
    0% {transform: translateY(0) rotate(0);}
    100% {transform: translateY(100vh) rotate(360deg);}
}
</style>
</head>
<body>
<h1>🎉 Sürpriz! Doğum Günün Kutlu Olsun 🎉</h1>
<p>Bugün çok özel bir gün… Çünkü sen doğdun! 💖</p>
<button onclick="showSurprise()">Sürprize Tıkla 🎁</button>
<div id="surprise">🎂 Nice mutlu yaşlara! ❤️<br>✨ Sağlık, neşe ve başarı dolu bir yıl seni bekliyor! ✨</div>
<script>
function createConfetti() {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.backgroundColor = randomColor();
    confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 5000);
}
function randomColor() {
    const colors = ["#ff4d6d", "#ffccd5", "#c9184a", "#ffb3c1", "#ff8fa3"];
    return colors[Math.floor(Math.random() * colors.length)];
}
setInterval(createConfetti, 200);
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}
</script>
</body>
</html>
